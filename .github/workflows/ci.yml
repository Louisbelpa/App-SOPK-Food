name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.57.1
    steps:
      - uses: actions/checkout@v4
      - run: swiftlint lint --strict

  kit-tests:
    name: SOPKKit — tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/SOPKKit

  app-build-test:
    name: App iOS — build & tests (macOS)
    # Les minutes macOS coûtent 10× plus : uniquement sur PR et sur main.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [lint, kit-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence du projet Xcode
        id: project
        run: |
          if [ -d App/SOPK.xcodeproj ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "Projet Xcode pas encore créé (ticket iOS n°2) : job ignoré."; fi
      - name: Build & test
        if: steps.project.outputs.exists == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app || true
          xcodebuild test \
            -project App/SOPK.xcodeproj \
            -scheme SOPK \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO
