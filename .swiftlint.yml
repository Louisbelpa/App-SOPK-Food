included:
  - App
  - Packages/SOPKKit/Sources
  - Packages/SOPKKit/Tests
excluded:
  - "**/.build"
  - "**/DerivedData"

opt_in_rules:
  - empty_count
  - first_where
  - sorted_first_last
  - closure_spacing
  - force_unwrapping
  - implicitly_unwrapped_optional

identifier_name:
  min_length: 1
  excluded: [id, x, y]

line_length:
  warning: 140
  error: 200
  ignores_comments: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 400

# Les vues SwiftUI doivent rester petites : découper au-delà.
function_body_length:
  warning: 60
  error: 100
