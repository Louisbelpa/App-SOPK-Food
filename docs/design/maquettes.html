<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ovéa — maquettes</title>
<meta name="description" content="Maquettes haute fidélité des écrans du MVP d'Ovéa (iOS 18), light et dark, à partir des tokens de docs/design/tokens.json.">
<style>
/* ---- Tokens (générés depuis tokens.json) ---- */
:root {
  --background: #F8F5EF;
  --surface: #FFFFFF;
  --surface-muted: #EFEAE1;
  --surface-raised: #FFFFFF;
  --separator: #E2DCD1;
  --border: #8A8276;
  --text-primary: #1E2621;
  --text-secondary: #566059;
  --text-tertiary: #5F6661;
  --accent: #3B6A55;
  --on-accent: #FFFFFF;
  --accent-soft: #E2ECE5;
  --on-accent-soft: #2A4F3F;
  --highlight: #A54F2E;
  --on-highlight: #FFFFFF;
  --highlight-soft: #F6E5DB;
  --success: #2D6A47;
  --success-soft: #E1EEE4;
  --warning: #855600;
  --warning-soft: #FAEFD8;
  --info: #2E5C78;
  --info-soft: #E2EDF3;
  --destructive: #B3261E;
  --period: #9E3957;
  --on-period: #FFFFFF;
  --period-soft: #F5E3E7;
  --spotting: #B2647A;
  --miel: #795610;
  --miel-soft: #F6ECD3;
  --olive: #4A6220;
  --olive-soft: #E7EED8;
  --lagon: #1E6662;
  --lagon-soft: #DBEEED;
  --ardoise: #3C4E86;
  --ardoise-soft: #E4E8F5;
  --argile: #984829;
  --argile-soft: #F7E5DB;
  --lavande: #654F8E;
  --lavande-soft: #ECE6F5;
  --shadow-card: 0 1px 2px rgba(43,58,48,.04), 0 4px 12px rgba(43,58,48,.06);
  --shadow-raised: 0 8px 24px rgba(43,58,48,.10);
  --card-stroke: var(--separator);
}
html[data-theme="dark"] {
  --background: #121614;
  --surface: #1B201D;
  --surface-muted: #252C28;
  --surface-raised: #222825;
  --separator: #323A35;
  --border: #7D8680;
  --text-primary: #F0EDE6;
  --text-secondary: #B4BBB5;
  --text-tertiary: #959D97;
  --accent: #8EC3A6;
  --on-accent: #0E2218;
  --accent-soft: #21362B;
  --on-accent-soft: #AAD6BD;
  --highlight: #EE9F7D;
  --on-highlight: #2A1206;
  --highlight-soft: #3B251B;
  --success: #8DCB9F;
  --success-soft: #1E3426;
  --warning: #E8BD69;
  --warning-soft: #372C13;
  --info: #90C1DE;
  --info-soft: #1B2E39;
  --destructive: #FFB4AB;
  --period: #F097AF;
  --on-period: #33101C;
  --period-soft: #3C1E28;
  --spotting: #D99AAB;
  --miel: #E3BF72;
  --miel-soft: #382E17;
  --olive: #B6CB86;
  --olive-soft: #2A321F;
  --lagon: #80CAC7;
  --lagon-soft: #173434;
  --ardoise: #A9B6EB;
  --ardoise-soft: #222A43;
  --argile: #EDA585;
  --argile-soft: #3B251B;
  --lavande: #C7B7E6;
  --lavande-soft: #2D273E;
  --shadow-card: none;
  --shadow-raised: none;
}

:root {
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --serif: "New York", ui-serif, "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --rounded: ui-rounded, "SF Pro Rounded", var(--sans);
  --page-bg: #E9E4DA;
  --page-text: #1E2621;
  --frame: #1A1C1B;
  color-scheme: light;
}
html[data-theme="dark"] { --page-bg: #0B0D0C; --page-text: #F0EDE6; --frame: #2A2E2C; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page-bg); color: var(--page-text); font-family: var(--sans); -webkit-font-smoothing: antialiased; transition: background .25s; }
.page-head { max-width: 1200px; margin: 0 auto; padding: 32px 16px 8px; display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.page-head h1 { font-family: var(--serif); font-weight: 600; font-size: 32px; margin: 0 0 4px; }
.page-head p { margin: 0; color: var(--text-secondary); font-size: 15px; max-width: 640px; line-height: 1.45; }
.toggle { font: 600 15px var(--sans); color: var(--on-accent); background: var(--accent); border: 0; border-radius: 999px; padding: 12px 20px; min-height: 44px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.toggle:focus-visible, button:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.rail { display: flex; gap: 48px; overflow-x: auto; padding: 32px 16px 56px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
@media (min-width: 1300px) { .rail { flex-wrap: wrap; justify-content: center; overflow: visible; } }
.shot { flex: none; scroll-snap-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.shot figcaption { font-size: 14px; font-weight: 600; color: var(--text-secondary); letter-spacing: .02em; }

/* ---- Cadre iPhone 390×844 ---- */
.phone { width: 390px; height: 844px; border-radius: 55px; position: relative; overflow: hidden; background: var(--background); color: var(--text-primary);
  box-shadow: 0 0 0 11px var(--frame), 0 0 0 12px #4a4d4b, 0 30px 70px rgba(0,0,0,.28); font-size: 17px; line-height: 1.3; transition: background .25s, color .25s; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 30; }
.status { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: center; padding: 6px 34px 0 46px; font: 600 17px var(--sans); z-index: 25; }
.status .sys { display: flex; gap: 6px; align-items: center; }
.status .bat { width: 25px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; position: relative; opacity: .9; }
.status .bat::after { content: ""; position: absolute; inset: 1.5px; right: 6px; background: currentColor; border-radius: 1.5px; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: var(--text-primary); z-index: 40; }
.screen { position: absolute; inset: 54px 0 0 0; overflow: hidden; padding: 0 20px; }
.screen.with-tabs { bottom: 83px; }

/* ---- Tab bar ---- */
.tabbar { position: absolute; bottom: 0; left: 0; right: 0; height: 83px; background: color-mix(in srgb, var(--surface) 92%, transparent); border-top: .5px solid var(--separator); display: grid; grid-template-columns: repeat(4, 1fr); padding: 7px 8px 0; z-index: 20; backdrop-filter: blur(20px); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; font-weight: 500; color: var(--text-secondary); }
.tab svg { width: 26px; height: 26px; }
.tab.on { color: var(--accent); }

/* ---- Typo ---- */
.display { font: 600 34px/1.12 var(--serif); letter-spacing: -.01em; margin: 0; }
.title1 { font: 600 28px/1.15 var(--serif); margin: 0; }
.title2 { font: 600 22px/1.2 var(--serif); margin: 0; }
.title3 { font: 600 20px/1.25 var(--sans); margin: 0; }
.headline { font: 600 17px/1.3 var(--sans); }
.callout { font-size: 16px; }
.sub { font-size: 15px; line-height: 1.35; }
.foot { font-size: 13px; line-height: 1.35; }
.cap { font-size: 12px; font-weight: 500; }
.overline { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin: 0 0 8px; }
.metric { font: 600 22px var(--rounded); font-variant-numeric: tabular-nums; }
.quote { font: italic 400 19px/1.35 var(--serif); }
.muted { color: var(--text-secondary); }
.c-accent { color: var(--accent); } .c-info { color: var(--info); } .c-period { color: var(--period); } .c-destructive { color: var(--destructive); }

/* ---- Icônes ---- */
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 16px; height: 16px; } svg.i.lg { width: 28px; height: 28px; } svg.i.xl { width: 44px; height: 44px; stroke-width: 1.5; }

/* ---- Composants ---- */
.card { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow-card); border: .5px solid var(--card-stroke); }
.card.soft { background: var(--accent-soft); box-shadow: none; border-color: transparent; }
.row { display: flex; align-items: center; gap: 12px; }
.stack > * + * { margin-top: 16px; }
.sec { margin-top: 32px; }
.chips { display: flex; gap: 8px; flex-wrap: nowrap; overflow: hidden; }
.chips.wrap { flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--surface-muted); color: var(--text-primary); font-size: 15px; font-weight: 500; white-space: nowrap; border: 1.5px solid transparent; flex: none; }
.chip.on { background: var(--accent-soft); color: var(--on-accent-soft); border-color: var(--accent); }
.chip.dashed { background: transparent; border: 1.5px dashed var(--border); color: var(--text-secondary); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 14px; font: 600 17px var(--sans); border: 0; width: 100%; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.ghost { background: transparent; color: var(--accent); height: 44px; }
.btn.disabled { background: var(--surface-muted); color: var(--text-secondary); }
.iconbtn { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: var(--surface-muted); color: var(--accent); flex: none; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--surface-muted); color: var(--text-primary); }
.cat { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--fg); }
.search { display: flex; align-items: center; gap: 8px; height: 40px; border-radius: 12px; background: var(--surface-muted); padding: 0 12px; color: var(--text-secondary); font-size: 17px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-muted); border-radius: 10px; padding: 2px; }
.seg span { text-align: center; font-size: 13px; font-weight: 500; padding: 7px 4px; border-radius: 8px; color: var(--text-primary); }
.seg span.on { background: var(--surface-raised); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; border: .5px solid var(--separator); }
.banner { display: flex; gap: 12px; padding: 14px 16px; border-radius: 20px; background: var(--info-soft); }
.banner.warn { background: var(--warning-soft); }
.banner > svg { color: var(--info); margin-top: 1px; }
.banner.warn > svg { color: var(--warning); }
.banner a { color: var(--info); font-weight: 600; text-decoration: none; font-size: 15px; display: inline-block; margin-top: 6px; }

/* Teintes de saison */
.t-miel { --fg: var(--miel); --soft: var(--miel-soft); }
.t-olive { --fg: var(--olive); --soft: var(--olive-soft); }
.t-lagon { --fg: var(--lagon); --soft: var(--lagon-soft); }
.t-ardoise { --fg: var(--ardoise); --soft: var(--ardoise-soft); }
.t-argile { --fg: var(--argile); --soft: var(--argile-soft); }
.t-lavande { --fg: var(--lavande); --soft: var(--lavande-soft); }
.vig { background: var(--soft); color: var(--fg); position: relative; overflow: hidden; display: grid; place-items: center; border-radius: 14px; }
.vig svg.blobs { position: absolute; inset: 0; width: 100%; height: 100%; }
.vig svg.blobs * { fill: var(--fg); }
.vig > svg.i { position: relative; }

/* Énergie */
.energy { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.energy div { height: 76px; border-radius: 14px; background: var(--surface-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; }
.energy div.on { background: var(--accent); color: var(--on-accent); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
.bars i { width: 7px; border-radius: 2px; border: 1.5px solid var(--border); display: block; }
.bars i:nth-child(1) { height: 11px; } .bars i:nth-child(2) { height: 16px; } .bars i:nth-child(3) { height: 21px; }
.bars i.f { background: var(--accent); border-color: var(--accent); }
.on .bars i { border-color: color-mix(in srgb, var(--on-accent) 60%, transparent); }
.on .bars i.f { background: var(--on-accent); border-color: var(--on-accent); }
.mood { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mood div { height: 64px; border-radius: 14px; background: var(--surface-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600; }
.mood div svg { color: var(--accent); }
.mood div.on { background: var(--accent); color: var(--on-accent); }
.mood div.on svg { color: var(--on-accent); }
.mood.compact div { height: 54px; flex-direction: row; gap: 6px; }
.energy.compact div { height: 60px; gap: 6px; }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg3 span { height: 38px; border-radius: 10px; background: var(--surface-muted); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 500; }
.seg3 span.on { background: var(--accent-soft); color: var(--on-accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }

/* Liste groupée (Réglages) */
.group { background: var(--surface); border-radius: 14px; overflow: hidden; border: .5px solid var(--card-stroke); }
.group .it { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; font-size: 16px; }
.group .it + .it { border-top: .5px solid var(--separator); margin-left: 52px; padding-left: 0; }
.group .it .ico { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.group .it + .it .ico { margin-left: -40px; }
.group .it .v { margin-left: auto; color: var(--text-secondary); font-size: 15px; display: flex; align-items: center; gap: 4px; }
.group-title { font-size: 13px; color: var(--text-secondary); margin: 22px 16px 7px; text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--accent); position: relative; margin-left: auto; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; right: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.switch.off { background: var(--surface-muted); box-shadow: inset 0 0 0 1.5px var(--border); }
.switch.off::after { right: auto; left: 2px; }

/* Calendrier */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 4px; text-align: center; }
.cal .dow { font-size: 12px; font-weight: 600; color: var(--text-secondary); padding-bottom: 6px; }
.cal .d { height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 500 16px var(--rounded); font-variant-numeric: tabular-nums; position: relative; }
.cal .d .n { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; }
.cal .d.p .n { background: var(--period); color: var(--on-period); font-weight: 600; }
.cal .d.s .n { box-shadow: inset 0 0 0 2px var(--spotting); }
.cal .d.today .n { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent); font-weight: 700; }
.cal .d .dot { width: 5px; height: 5px; border-radius: 3px; background: var(--text-secondary); position: absolute; bottom: 1px; }
.cal .d.future { color: var(--text-tertiary); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-p { width: 14px; height: 14px; border-radius: 7px; background: var(--period); }
.lg-s { width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--spotting); }
.lg-c { width: 6px; height: 6px; border-radius: 3px; background: var(--text-secondary); }
.lg-t { width: 14px; height: 14px; border-radius: 7px; box-shadow: inset 0 0 0 2px var(--accent); }
.hist .it { padding: 12px 0; border-top: .5px solid var(--separator); }
.hist .track { height: 8px; border-radius: 4px; background: var(--surface-muted); margin-top: 8px; position: relative; overflow: hidden; }
.hist .track b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--period); border-radius: 4px; }
.hist .track i { position: absolute; top: 0; bottom: 0; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--border); border-radius: 0 4px 4px 0; }

/* Lecteur */
.ring { width: 220px; height: 220px; position: relative; margin: 0 auto; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .t { font: 300 64px var(--rounded); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-muted); }
.progress i.d { background: var(--accent); }
.progress i.c { background: linear-gradient(90deg, var(--accent) 40%, var(--surface-muted) 40%); }
.ctrl { display: flex; align-items: center; justify-content: center; gap: 28px; }
.ctrl .b { width: 56px; height: 56px; border-radius: 28px; display: grid; place-items: center; background: var(--surface-muted); color: var(--text-primary); }
.ctrl .b.main { width: 80px; height: 80px; border-radius: 40px; background: var(--accent); color: var(--on-accent); }

/* Sheet */
.dim { position: absolute; inset: 0; background: rgba(10,14,12,.38); z-index: 10; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 62px; background: var(--surface-raised); border-radius: 28px 28px 0 0; z-index: 15; padding: 8px 20px 0; box-shadow: var(--shadow-raised); }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--border); opacity: .6; margin: 0 auto 10px; }
.field { height: 44px; border-radius: 10px; background: var(--surface-muted); display: flex; align-items: center; padding: 0 12px; color: var(--text-tertiary); font-size: 16px; }
.lbl { font-size: 15px; font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.optsep { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; margin: 18px 0 14px; }
.optsep::before, .optsep::after { content: ""; flex: 1; height: .5px; background: var(--separator); }
.toast { position: absolute; }
.navbar { display: flex; align-items: center; justify-content: space-between; height: 44px; color: var(--accent); font-size: 17px; }
.check { width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid var(--border); flex: none; display: grid; place-items: center; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ingr { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: .5px solid var(--separator); font-size: 16px; }
.ingr .q { margin-left: auto; color: var(--text-secondary); font-variant-numeric: tabular-nums; font-size: 15px; white-space: nowrap; }
.ingr.done .nm { color: var(--text-secondary); text-decoration: line-through; }
.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 34px; background: color-mix(in srgb, var(--background) 94%, transparent); border-top: .5px solid var(--separator); display: flex; gap: 12px; z-index: 5; backdrop-filter: blur(20px); }
.stepper { display: inline-flex; align-items: center; gap: 0; background: var(--surface-muted); border-radius: 10px; height: 36px; }
.stepper span { width: 40px; display: grid; place-items: center; color: var(--accent); }
.stepper b { font: 600 15px var(--rounded); padding: 0 6px; }
</style>
</head>
